<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimestampTool</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: white; /* pure white brand background */
    }

    .header-row {
        display: flex;
        flex-direction: column; /* logo above title */
        align-items: flex-start; /* left aligned */
        margin-bottom: 20px;
    }

    .logo {
        width: 128px;      /* enlarged logo */
        height: auto;
        max-width: none;   /* prevents iPhone Chrome auto-shrink */
        margin-bottom: 10px;
    }

    .title {
        font-size: 22px;
        font-weight: 600;
        text-align: left;
    }

    #stampBox {
        width: 100%;
        padding: 12px 20px; /* consistent right padding */
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 16px;
        background: white;
        text-align: left;
        box-sizing: border-box;
    }

    button {
        padding: 10px 18px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        background: #0078ff;
        color: white;
        cursor: pointer;
        display: inline-block; /* button only as wide as text */
        text-align: left;
    }

    button:active {
        opacity: 0.85;
    }
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundary Logo">
    <div class="title">TimestampTool</div>
</div>

<input id="stampBox" readonly placeholder="Tap button to generate timestamp">

<button onclick="makeStamp()">Generate Timestamp</button>

<script>
function makeStamp() {
    const now = new Date();
    const stamp = now.toLocaleString();
    const box = document.getElementById("stampBox");
    box.value = stamp;

    /* iPhone Chrome-safe copy method */
    box.select();
    document.execCommand("copy");
}
</script>

</body>
</html>
