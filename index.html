<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimestampTool</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        padding-bottom: 100px;
        background: white;
    }

    .header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 20px;
    }

    .logo {
        width: 128px;
        height: auto;
        margin-bottom: 10px;
    }

    .title {
        font-size: 24px;
        font-weight: 700;
        text-align: left;
    }

    .tagline {
        font-size: 16px;
        color: #666;
        margin-top: 6px;
        margin-bottom: 20px;
        text-align: left;
        line-height: 1.4;
    }

    #stampBox {
        width: 100%;
        padding: 12px 20px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 16px;
        background: white;
        text-align: left;
        box-sizing: border-box;
    }

    .button-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    button {
        padding: 10px 18px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        background: #0078ff;
        color: white;
        cursor: pointer;
    }

    button:active {
        opacity: 0.85;
    }

    .buy-footer {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        z-index: 1000;
    }

    .buy-button {
        padding: 10px 24px;
        font-size: 16px;
        font-weight: 600;
        background: #0078ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
    }
</style>
</head>

<body>

<div class="header-row">
    <img src="./IMG_1741.jpeg" class="logo" alt="MicroFoundry Logo">
    <div class="title">TimestampTool</div>
    <div class="tagline">Fast, accurate timestamps for notes and records.</div>
</div>

<input
    id="stampBox"
    readonly
    placeholder="Tap button to generate timestamp">

<div class="button-row">
    <button onclick="makeStamp()">Generate Timestamp</button>
    <button onclick="copyStamp()">Copy</button>
</div>

<div class="buy-footer" id="buyFooter">
    <button class="buy-button">Buy This Tool</button>
</div>

<script>
function makeStamp() {
    const now = new Date();

    const stamp = now.toLocaleString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
    });

    document.getElementById('stampBox').value = stamp;
}

function copyStamp() {
    const stamp = document.getElementById('stampBox').value;

    if (stamp) {
        navigator.clipboard.writeText(stamp);
    }
}

const footer = document.getElementById('buyFooter');

document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('focus', () => {
        footer.style.display = 'none';
    });

    el.addEventListener('blur', () => {
        footer.style.display = 'block';
    });
});
</script>

</body>
</html>
